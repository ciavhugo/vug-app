<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bg { fill: #f4f4f5; stroke: #e4e4e7; }
    .text { fill: #18181b; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: rgba(255,255,255,0.1); stroke: rgba(255,255,255,0.2); }
      .text { fill: #ffffff; }
    }
  </style>

  <!-- Fundo -->
  <rect
    x="0"
    y="0"
    width="32"
    height="32"
    rx="6"
    class="bg"
  />

  <!-- Texto -->
  <text
    x="50%"
    y="85%"
    dominant-baseline="middle"
    text-anchor="middle"
    font-family="monospace"
    font-size="54"
    font-weight="900"
    letter-spacing="-1"
    class="text"
  >
    *
  </text>
</svg>